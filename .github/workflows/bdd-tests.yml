name: BDD Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1-5'

jobs:
  test:
    # Pinned: ubuntu-latest is moving to a release the Playwright browser deps don't support yet
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      BASE_URL: https://www.saucedemo.com
      CI: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # Gate: the full suite only runs if smoke passes
      - name: Run smoke tests
        run: npm run test:smoke

      - name: Run full suite
        run: npm test

      - name: Upload report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: cucumber-report
          path: reports/
          retention-days: 14
